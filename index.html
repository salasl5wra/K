<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ============================================
   TOKENS — Dark Love
   ============================================ */
:root{
  --paper:        #e9ded0;
  --paper-dark:    #d9caae;
  --ink:           #211a16;
  --ink-soft:      #564439;
  --wine:          #7a0c1e;
  --wine-deep:     #3d0710;
  --blood:         #9c1320;
  --gold:          #8a6a2f;
  --gold-soft:     #b8943f;
  --void:          #0a0707;
  --shadow:        rgba(0, 0, 0, 0.6);

  --display: 'Cinzel', serif;
  --script:  'Cormorant Garamond', serif;
  --body:    'EB Garamond', serif;
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  padding:0;
  height:100%;
  background:
    radial-gradient(ellipse at top, #1a0d0f 0%, #0d0606 55%, #050303 100%);
  font-family: var(--body);
  color: var(--ink);
  overflow:hidden;
}

body.locked{ overflow:hidden; }

/* ============================================
   PANTALLA DE CONTRASEÑA
   ============================================ */
#lockscreen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:
    radial-gradient(ellipse at top, #1a0d0f 0%, #0d0606 55%, #050303 100%);
  z-index:200;
  padding:24px;
  text-align:center;
}

body.unlocked #lockscreen{ display:none; }

#lockscreen .seal{
  width:64px;
  height:64px;
  border-radius:50%;
  border:1px solid var(--gold-soft);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:28px;
  color:var(--blood);
  font-size:24px;
  opacity:0.9;
  box-shadow:0 0 18px rgba(156,19,32,0.35);
}

#lockscreen h1{
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(24px, 5.5vw, 38px);
  color:var(--paper);
  letter-spacing:0.08em;
  margin:0 0 10px;
  text-transform:uppercase;
}

#lockscreen p{
  font-family:var(--script);
  font-style:italic;
  color:#9c8770;
  font-size:18px;
  margin:0 0 36px;
  max-width:360px;
}

#lock-form{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}

#lock-input{
  background:transparent;
  border:none;
  border-bottom:1px solid var(--gold-soft);
  color:var(--paper);
  font-family:var(--script);
  font-size:24px;
  letter-spacing:0.5em;
  text-align:center;
  width:220px;
  padding:8px 0;
  outline:none;
}
#lock-input::placeholder{
  color:#5a4738;
  letter-spacing:0.3em;
  font-size:14px;
}
#lock-input:focus{ border-bottom-color:var(--blood); }

#lock-submit{
  background:none;
  border:1px solid var(--gold-soft);
  color:var(--gold-soft);
  font-family:var(--display);
  letter-spacing:0.15em;
  text-transform:uppercase;
  font-size:12px;
  padding:10px 28px;
  border-radius:2px;
  cursor:pointer;
  transition:all .25s ease;
  margin-top:6px;
}
#lock-submit:hover{
  background:var(--blood);
  border-color:var(--blood);
  color:var(--paper);
}

#lock-error{
  font-family:var(--body);
  font-size:13px;
  color:var(--blood);
  height:18px;
  letter-spacing:0.02em;
}

/* ============================================
   ESCENARIO DEL LIBRO
   ============================================ */
#stage{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  perspective:2400px;
  padding:20px;
}

body.unlocked #stage{ display:flex; }

#stage::before{
  content:"";
  position:absolute;
  width:min(70vw, 900px);
  height:min(70vw, 900px);
  background:radial-gradient(circle, rgba(156,19,32,0.14) 0%, rgba(156,19,32,0) 70%);
  pointer-events:none;
}

/* ============================================
   LIBRO
   ============================================ */
#book{
  position:relative;
  width:min(86vw, 420px);
  height:min(74vh, 620px);
  transform-style:preserve-3d;
}

.page{
  position:absolute;
  inset:0;
  background:
    linear-gradient(135deg, var(--paper) 0%, var(--paper-dark) 100%);
  border-radius:2px 8px 8px 2px;
  box-shadow:
    0 25px 70px var(--shadow),
    inset -1px 0 0 rgba(0,0,0,0.15);
  padding:40px 34px 34px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.page::after{
  content:"";
  position:absolute;
  top:0; left:0; bottom:0;
  width:28px;
  background:linear-gradient(90deg, rgba(0,0,0,0.25), rgba(0,0,0,0));
  pointer-events:none;
}

.page-eyebrow{
  font-family:var(--display);
  font-size:10.5px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:var(--blood);
  margin:0 0 6px;
}

.page-title{
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(19px, 4.8vw, 26px);
  color:var(--wine-deep);
  margin:0 0 4px;
  line-height:1.25;
  letter-spacing:0.01em;
}

.page-date{
  font-family:var(--script);
  font-style:italic;
  font-size:14px;
  color:var(--ink-soft);
  margin:0 0 18px;
}

.page-divider{
  width:46px;
  height:1px;
  background:linear-gradient(90deg, var(--blood), transparent);
  margin:0 0 20px;
  position:relative;
}
.page-divider::after{
  content:"❦";
  position:absolute;
  left:50px;
  top:-9px;
  font-size:13px;
  color:var(--gold-soft);
}

.page-body{
  font-family:var(--body);
  font-size:15.5px;
  line-height:1.78;
  color:var(--ink);
  overflow-y:auto;
  padding-right:6px;
  flex:1;
}
.page-body p{ margin:0 0 1em; }
.page-body p:last-child{ margin-bottom:0; }

.page-body::-webkit-scrollbar{ width:4px; }
.page-body::-webkit-scrollbar-thumb{ background:var(--blood); border-radius:4px; }
.page-body::-webkit-scrollbar-track{ background:transparent; }

.page-number{
  text-align:center;
  font-family:var(--script);
  font-style:italic;
  font-size:12px;
  color:var(--ink-soft);
  margin-top:14px;
  opacity:0.8;
}

/* ---- página de Portada ---- */
#page-cover{
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(ellipse at center, #2c0810 0%, #190509 55%, #0a0304 100%);
  color:var(--paper);
}
#page-cover::before{
  content:"";
  position:absolute;
  inset:14px;
  border:1px solid rgba(184,148,63,0.35);
  pointer-events:none;
}
#page-cover .seal{
  width:58px; height:58px; border-radius:50%;
  border:1px solid var(--gold-soft);
  display:flex; align-items:center; justify-content:center;
  color:var(--blood); font-size:22px;
  margin-bottom:22px;
  box-shadow:0 0 22px rgba(156,19,32,0.4);
}
#page-cover h1{
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(24px, 6vw, 34px);
  letter-spacing:0.06em;
  margin:0 0 10px;
  text-transform:uppercase;
}
#page-cover .cover-sub{
  font-family:var(--script);
  font-style:italic;
  font-size:16px;
  color:#b69b7d;
  max-width:260px;
}
#page-cover .cover-tap{
  position:absolute;
  bottom:30px;
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--gold-soft);
  opacity:0.8;
}

/* ---- página de Índice ---- */
.toc-list{
  list-style:none;
  margin:0; padding:0;
  flex:1;
  overflow-y:auto;
}
.toc-list li{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
  font-family:var(--body);
  font-size:14.5px;
  color:var(--ink);
  padding:10px 0;
  border-bottom:1px dotted var(--gold-soft);
  cursor:pointer;
}
.toc-list li:hover{ color:var(--blood); }
.toc-list .toc-name{ flex:1; }
.toc-list .toc-no{
  font-family:var(--script);
  font-style:italic;
  color:var(--ink-soft);
  font-size:13px;
}
.toc-section-label{
  font-family:var(--display);
  font-size:10.5px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--gold);
  margin:18px 0 4px;
}
.toc-section-label:first-child{ margin-top:0; }

/* ---- página de Post-its / Cartas ---- */
#page-postits{
  background:
    repeating-linear-gradient(0deg, #1d1310, #1d1310 2px, #150d0b 2px, #150d0b 4px),
    linear-gradient(135deg, #241612 0%, #120a08 100%);
  padding:30px 20px 20px;
}
#page-postits .page-eyebrow,
#page-postits .page-title{ color:var(--paper); }
#page-postits .page-title{ text-align:center; }
#page-postits .page-eyebrow{ text-align:center; color:var(--blood); }
#page-postits .page-divider{ margin:10px auto 16px; background:var(--gold-soft); opacity:0.5; }
#page-postits .page-divider::after{ left:50%; transform:translateX(-50%); top:-9px; }

.postit-board{
  flex:1;
  overflow-y:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px 10px;
  padding:4px 4px 14px;
  align-content:start;
}

.postit{
  position:relative;
  padding:14px 12px 16px;
  font-family:var(--script);
  font-style:italic;
  font-size:13.5px;
  line-height:1.42;
  color:#241813;
  box-shadow:0 8px 16px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.15) inset;
  min-height:90px;
  display:flex;
  align-items:center;
  word-break:break-word;
  border:1px solid rgba(0,0,0,0.12);
}
.postit::before{
  content:"";
  position:absolute;
  top:-9px;
  left:50%;
  transform:translateX(-50%) rotate(-2deg);
  width:38px;
  height:16px;
  background:rgba(0,0,0,0.25);
  border:1px solid rgba(0,0,0,0.15);
}

/* paleta dark love: borgoña, ciruela, óxido, gris piedra, dorado apagado, vino */
.postit:nth-child(10n+1){ background:#c79a4f; }
.postit:nth-child(10n+2){ background:#b6738a; }
.postit:nth-child(10n+3){ background:#8c98a8; }
.postit:nth-child(10n+4){ background:#a98f6e; }
.postit:nth-child(10n+5){ background:#c0876a; }
.postit:nth-child(10n+6){ background:#9d83a8; }
.postit:nth-child(10n+7){ background:#c79a4f; }
.postit:nth-child(10n+8){ background:#8c98a8; }
.postit:nth-child(10n+9){ background:#b6738a; }
.postit:nth-child(10n+10){ background:#a98f6e; }

.postit:nth-child(6n+1){ transform:rotate(-3deg); }
.postit:nth-child(6n+2){ transform:rotate(2deg); }
.postit:nth-child(6n+3){ transform:rotate(-1.5deg); }
.postit:nth-child(6n+4){ transform:rotate(3deg); }
.postit:nth-child(6n+5){ transform:rotate(-2.5deg); }
.postit:nth-child(6n+6){ transform:rotate(1.5deg); }
.postit:hover{ transform:scale(1.06) rotate(0deg); z-index:5; transition:transform .2s ease; }

.postit-board::-webkit-scrollbar{ width:4px; }
.postit-board::-webkit-scrollbar-thumb{ background:var(--blood); border-radius:4px; }
.postit-board::-webkit-scrollbar-track{ background:transparent; }

/* ============================================
   NAVEGACIÓN
   ============================================ */
#book-nav{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:18px;
  z-index:50;
}
.nav-btn{
  background:rgba(233,222,208,0.06);
  border:1px solid var(--gold-soft);
  color:var(--gold-soft);
  width:38px; height:38px;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  transition:all .2s ease;
}
.nav-btn:hover{ background:var(--blood); border-color:var(--blood); color:var(--paper); }
.nav-btn:disabled{ opacity:0.25; cursor:default; background:none; color:var(--gold-soft); }

#nav-label{
  font-family:var(--script);
  font-style:italic;
  color:#b69b7d;
  font-size:13px;
  min-width:120px;
  text-align:center;
}

/* ============================================
   RESPONSIVE / MOTION
   ============================================ */
@media (max-width:480px){
  .page{ padding:30px 22px 26px; }
}

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; animation:none !important; }
}

:focus-visible{ outline:2px solid var(--blood); outline-offset:2px; }
</style>
</head>
<body class="locked">

<!-- ============================================
     PANTALLA DE CONTRASEÑA
     ============================================ -->
<div id="lockscreen">
  <div class="seal">❤</div>
  <h1>Nuestro Lugar Especial</h1>
  <p>Un espacio para recordarte que siempre estás en mi mente.</p>
  <form id="lock-form">
    <input type="password" id="lock-input" placeholder="DDMMAA" inputmode="numeric" maxlength="6" autocomplete="off">
    <button type="submit" id="lock-submit">Entrar</button>
    <div id="lock-error"></div>
  </form>
</div>

<!-- ============================================
     ESCENARIO DEL LIBRO
     ============================================ -->
<div id="stage">
  <div id="book"></div>
</div>

<div id="book-nav" style="display:none;">
  <button class="nav-btn" id="prev-btn" aria-label="Página anterior">‹</button>
  <span id="nav-label"></span>
  <button class="nav-btn" id="next-btn" aria-label="Página siguiente">›</button>
</div>

<script>
/* ============================================================
   CONTENIDO DEL LIBRO — edita aquí para agregar capítulos
   ============================================================
   IMPORTANTE: cada párrafo va ENTERO en una sola línea, entre
   comillas "...", separado del siguiente por una coma.
   NUNCA presiones Enter dentro de un párrafo: eso rompe el
   archivo completo (un salto de línea real dentro de "..."
   es un error de sintaxis en JavaScript).
   Si un párrafo es muy largo, no pasa nada: déjalo todo en
   una sola línea, por larga que se vea en el editor.
============================================================= */

/* Post-its: cada elemento es el texto de UN post-it. */
const NOTAS = [
  "Mentiría si dijera que no me dolió, me rompió un poco. Pero mi amor por ti es más grande que mi dolor, y sigo estando aquí para ti, como siempre.",
  "Quiero que sepas que sigo siendo tu ancla. Acepto tu realidad con él, pero mi cariño por ti sigue intacto y no me voy a ir a ninguna parte.",
  "Hay una parte de tu alma y de tu corazón que, a pesar de todo, siempre será mía.",
  "Decidí quedarme porque mi vida es mejor contigo en ella, incluso si es así. Siempre tendré un lugar seguro para ti cuando me necesites.",
  "Prometí cuidarte y no abandonarte. Aunque ahora lo tengas y me cueste aceptarlo, sigo aquí.",
  "Podrás pertenecerle a otro en la superficie, pero en latidos y en historia, siempre serás mía.",
  "El dolor de saberte con él es real, pero no apaga ni un solo segundo lo que siento por ti.",
  "Te dije que era complicado.",
  "Cuenta conmigo siempre.",
  "Pase lo que pase."
];

const RECORDATORIOS = [
  {
    titulo: "Agenda de mi corazón",
    fecha: "Recordatorio diario",
    texto: [
      "Lee esto cada vez que dudes de si me alejé: te querré toda la vida, acepto estar aquí de esta forma, y pase lo que pase o con quién estés, para mí siempre serás mía."
    ]
  }
];

const CAPITULOS = [
  {
    titulo: "Capítulo 1, Advertencias Ignoradas",
    fecha: "",
    texto: [
      "El primer cruce de palabras entre ellos no tuvo nada de romántico. Fue un choque eléctrico, áspero y territorial.",
      "Ella había cruzado el pasillo hacia el grupo que estaba tomando la capacitación, él no sabía que ella sería la nueva coordinadora del área. El ruido constante de las máquinas era abrumador, pero no tanto como la presencia del hombre que le cerró el paso. Él tenía la postura de alguien acostumbrado a dar órdenes y a que el mundo se apartara de su camino.",
      "—¿Qué haces aquí? —le preguntó él. Su voz era profunda, carente de cualquier amabilidad—. Esta no es tu área. Sal.",
      "El rechazo le golpeó el pecho a ella con una fuerza desproporcionada. Una oleada de humillación y furia le subió a la garganta. Podría haberse disculpado, pero en lugar de eso, alzó la barbilla, sosteniéndole la mirada un segundo más de lo socialmente aceptable. Vio sus ojos oscuros, la tensión en su mandíbula y, fugazmente, el destello de oro en su dedo anular.",
      "—Solo buscaba aprender —replicó ella, dándose la vuelta con el corazón latiendo a mil por hora—. No te preocupes, no me interesa quedarme donde no me llaman.",
      "Mientras se alejaba, sintió la mirada de él clavada en su espalda. Fue un rechazo, sí. Pero la dejó con una extraña y adictiva sensación de adrenalina circulando por sus venas.",
      "El destino, o quizás algo más, decidió que sus caminos debían volver a cruzarse poco tiempo después. Las sesiones para la nueva certificación los obligaron a sentarse en la misma mesa durante horas interminables.",
      "Comenzó con cruces de miradas. Luego, comentarios sarcásticos en voz baja. Para la segunda semana de entrenamiento, ya buscaban excusas para verse. En esas pláticas, las barreras cayeron con una velocidad vertiginosa. Ella sentía todo al doscientos por ciento; cada roce accidental de sus rodillas bajo la mesa era un incendio.",
      "Él no tardó en dejarle ver sus demonios. Le habló de su afición por las motocicletas a velocidades suicidas, de cómo una rutina monótona lo asfixiaba, y de su necesidad casi patológica de sentir que estaba a un segundo de perder el control.",
      "—Soy un desastre andante —le dijo una tarde, recargado contra un barandal—. Si te acercas demasiado, te vas a quemar. Yo no soy el héroe de la historia, soy el villano. Rompo las cosas. Rompo a las personas.",
      "Para cualquier otra persona, aquello habría sido una señal de evacuación inmediata. Pero para ella, sonó a un reto. A un hogar. La intensidad de él calmaba el caos interno que ella siempre llevaba por dentro. Ignorando todas las luces rojas, le sonrió con una devoción casi temeraria.",
      "—Yo no estoy buscando que me salven —respondió ella—. Y me gusta el fuego.",
      "El 31 de octubre, el aire de la ciudad estaba cargado con la electricidad típica de Halloween. Gente disfrazada, calles caóticas, el anonimato perfecto para quienes querían esconderse.",
      "Él pasó a recogerla a las cinco de la tarde. Cuando ella subió al coche, el silencio era denso, pesado, cargado con semanas de miradas reprimidas. Él condujo rápido, rozando los límites de velocidad, alimentándose del riesgo mientras la llevaba a un lugar alejado, a salvo de miradas indiscretas.",
      "Cuando finalmente aparcó el coche en la penumbra, apagó el motor, pero no las luces del tablero. Se giró hacia ella. Su respiración era pesada. Levantó una mano y trazó la línea de la mandíbula de ella con los nudillos. Ella cerró los ojos, sintiendo que el mundo entero convergía en ese único punto de contacto.",
      "Él se detuvo, retirando la mano un milímetro. La miró a los ojos con una seriedad brutal.",
      "—Te lo voy a preguntar una sola vez, y esta es tu última oportunidad para huir —susurró él, con la voz ronca—. Tengo un anillo en el dedo y un caos en la cabeza. ¿Estás segura de esto? Porque una vez que crucemos esta línea, no te voy a dejar ir tan fácilmente.",
      "Ella sintió ese miedo familiar al abandono, esa necesidad desesperada de aferrarse a algo, a alguien, latiendo en sus sienes. No lo dudó ni una fracción de segundo.",
      "—Estoy segura.",
      "Lo que siguió fue un choque de trenes. Fue brusco, desesperado y consumió todo el oxígeno que les quedaba. Se aferraron el uno al otro como si el mundo fuera a acabarse a la medianoche. Pero cuando la madrugada los alcanzó y el calor del momento se enfrió, ambos se dieron cuenta de su terrible error de cálculo.",
      "Habían pensado que ceder a la tentación, que quitarse las ganas esa sola noche, apagaría la curiosidad y los dejaría continuar con sus vidas. Fue exactamente lo contrario.",
      "Aquella primera vez no fue un cierre. Fue la primera dosis de una droga que no sabían que necesitaban. Y mientras él la dejaba de vuelta en su casa, con el silencio inundando el coche de nuevo, ella supo que ya no habría vuelta atrás. Estaban condenados a buscarse, a destruirse y a necesitarse, cada vez con más frecuencia, cada vez con más hambre."
    ]
  },
  {
    titulo: "Capítulo 2, Refugios de Papel",
    fecha: "",
    texto: [

const PASSWORD = "848484";

const lockForm  = document.getElementById('lock-form');
const lockInput = document.getElementById('lock-input');
const lockError = document.getElementById('lock-error');

lockForm.addEventListener('submit', function(e){
  e.preventDefault();
  if(lockInput.value === PASSWORD){
    document.body.classList.remove('locked');
    document.body.classList.add('unlocked');
    buildBook();
  } else {
    lockError.textContent = "Esa no es la fecha correcta 💔 Intenta de nuevo.";
    lockInput.value = "";
    lockInput.focus();
  }
});

/* ============================================================
   CONSTRUCCIÓN DEL LIBRO
============================================================= */
let pages = [];
let current = 0;

function buildBook(){
  pages = [];

  pages.push({ type:'cover' });
  pages.push({ type:'toc' });
  pages.push({ type:'postits' });
  CAPITULOS.forEach((c, i) => pages.push({ type:'content', eyebrow:'Nuestro libro', data:c, group:'capitulos', idx:i }));
  RECORDATORIOS.forEach((r, i) => pages.push({ type:'content', eyebrow:'Recordatorio', data:r, group:'recordatorios', idx:i }));

  current = 0;
  renderPage();
  document.getElementById('book-nav').style.display = 'flex';
}

function pageHTML(p, pageNum){
  if(p.type === 'cover'){
    return `
      <div class="page" id="page-cover">
        <div class="seal">❤</div>
        <h1>Nuestro Lugar Especial</h1>
        <p class="cover-sub">Un espacio para recordarte que siempre estás en mi mente.</p>
        <span class="cover-tap">Toca para abrir</span>
      </div>`;
  }
  if(p.type === 'postits'){
    const postitsHTML = NOTAS.map(texto => `<div class="postit">${texto}</div>`).join('');
    return `
      <div class="page" id="page-postits">
        <p class="page-eyebrow">Notas</p>
        <h2 class="page-title">Para ti</h2>
        <div class="page-divider"></div>
        <div class="postit-board">${postitsHTML}</div>
      </div>`;
  }
  if(p.type === 'toc'){
    let html = `<div class="page"><p class="page-eyebrow">Índice</p><h2 class="page-title">Tabla de contenidos</h2><div class="page-divider"></div><ul class="toc-list">`;
    let n = 2;
    html += `<li class="toc-section-label" style="border:none;cursor:default;">Notas</li>`;
    n++; html += tocRow('Notas para ti', n);
    html += `<li class="toc-section-label" style="border:none;cursor:default;">Nuestro libro</li>`;
    CAPITULOS.forEach((item)=>{ n++; html += tocRow(item.titulo, n); });
    html += `<li class="toc-section-label" style="border:none;cursor:default;">Recordatorios</li>`;
    RECORDATORIOS.forEach((item)=>{ n++; html += tocRow(item.titulo, n); });
    html += `</ul></div>`;
    return html;
  }
  const d = p.data;
  const paras = d.texto.map(t => `<p>${t}</p>`).join('');
  return `
    <div class="page">
      <p class="page-eyebrow">${p.eyebrow}</p>
      <h2 class="page-title">${d.titulo}</h2>
      ${d.fecha ? `<p class="page-date">${d.fecha}</p>` : ''}
      <div class="page-divider"></div>
      <div class="page-body">${paras}</div>
      <div class="page-number">${pageNum}</div>
    </div>`;
}

function tocRow(titulo, pageNum){
  return `<li onclick="goToPageNumber(${pageNum})"><span class="toc-name">${titulo}</span><span class="toc-no">${pageNum}</span></li>`;
}

function renderPage(){
  const book = document.getElementById('book');
  book.innerHTML = pageHTML(pages[current], current + 1);

  document.getElementById('prev-btn').disabled = (current === 0);
  document.getElementById('next-btn').disabled = (current === pages.length - 1);

  let label = '';
  if(pages[current].type === 'cover') label = 'Portada';
  else if(pages[current].type === 'toc') label = 'Índice';
  else if(pages[current].type === 'postits') label = 'Notas para ti';
  else label = pages[current].data.titulo;
  document.getElementById('nav-label').textContent = label;
}

function goToPageNumber(n){
  current = Math.max(0, Math.min(pages.length - 1, n - 1));
  renderPage();
}

function nextPage(){
  if(current < pages.length - 1){ current++; renderPage(); }
}
function prevPage(){
  if(current > 0){ current--; renderPage(); }
}

document.getElementById('next-btn').addEventListener('click', nextPage);
document.getElementById('prev-btn').addEventListener('click', prevPage);

document.getElementById('book').addEventListener('click', function(e){
  if(pages[current].type === 'cover'){ nextPage(); }
});

document.addEventListener('keydown', function(e){
  if(!document.body.classList.contains('unlocked')) return;
  if(e.key === 'ArrowRight') nextPage();
  if(e.key === 'ArrowLeft') prevPage();
});

let touchStartX = 0;
document.getElementById('stage').addEventListener('touchstart', e=>{
  touchStartX = e.changedTouches[0].screenX;
});
document.getElementById('stage').addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].screenX - touchStartX;
  if(Math.abs(dx) > 50){
    if(dx < 0) nextPage(); else prevPage();
  }
});
</script>
